</style>

function saveTextFile(filename, text, mime) {
  var done = false;
  try {
    var blob = new Blob([text], { type: mime });
    var isIOS = /iP(ad|hone|od)/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    var file = null;
    try { file = new File([blob], filename, { type: mime }); } catch (e) {}
    if (isIOS && file && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: filename }).catch(function () { showTextFallback(filename, text); });
      return;
    }
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename; a.style.display = "none";
    document.body.appendChild(a); a.click();
    setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(url); }, 4000);
    done = true;
  } catch (e) { console.error(e); }
  if (!done) showTextFallback(filename, text);

}

const STORAGE_KEY = "BRIDGE_INSPECTION_OFFLINE_V1";
const UNIT_TYPES = ["處", "m", "m²", "支", "組", "式"];

let appState = {
  currentBridgeIdx: 0,
  filter: "ALL",
  records: {} // keyed by bridge_id + "_" + bridge_name
};

// Load saved state from localStorage
function loadState() {
  try {
    const raw = Store.get(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && parsed.records) {
        appState.records = parsed.records;
      }
    }
  } catch (e) {
    console.error("Load storage error", e);
  }
}

function saveState() {
  try {
    const persisted = Store.set(STORAGE_KEY, JSON.stringify({ records: appState.records }));
    const now = new Date();
    document.getElementById("saveStatus").innerText = (persisted ? "" : "⚠僅暫存記憶體 ") +
      `已儲存 (${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}:${now.getSeconds().toString().padStart(2,'0')})`;
  } catch (e) {
    alert("儲存失敗或空間已滿,請先匯出備份!");
  }
}

function getBridgeKey(b) {
  return `${b.bridge_id || 'NOID'}_${b.bridge_name || b.file_name}`;
}

function ensureBridgeRecord(b) {
  const key = getBridgeKey(b);
  if (!appState.records[key]) {
    const today = localDateStr();
    appState.records[key] = {
      inspectDate: today,
      inspectors: "",
      cameraPrefix: "DSC_",
      lastPhotoNo: "",
      items: b.components.map((c, idx) => ({
        id: idx,
        category: c.category,
        location: c.location,
        component: c.component,
        prev_str: c.prev_str,
        is_alert: c.is_alert,
        status: c.is_na ? "NA" : "UNINSPECTED", // UNINSPECTED | NORMAL | DEFECT | NA
        photoNo: "",
        defects: [] // array of { defectLoc, defectType, D, E, R, U, qty, unit, photoNo, note }
      }))
    };
  }
  const record = appState.records[key];
  record.items.forEach(item => {
    if (typeof item.photoNo !== "string") item.photoNo = "";
    if (typeof item.component === "string") item.component = item.component.replace(/^[0-9０-９]+[.．、] */, "");
  });
  return record;
}

function init() {
  loadState();
  const sel = document.getElementById("bridgeSelect");
  sel.innerHTML = "";
  BRIDGES_DATA.forEach((b, idx) => {
    const opt = document.createElement("option");
    opt.value = idx;
    opt.text = `${idx + 1}. [${b.bridge_id}] ${b.bridge_name} (${b.mileage})`;
    sel.appendChild(opt);
  });
  renderAll();
}

function switchBridge() {
  appState.currentBridgeIdx = parseInt(document.getElementById("bridgeSelect").value, 10);
  renderAll();
}

function setFilter(f, btn) {
  appState.filter = f;
  document.querySelectorAll(".tab-btn").forEach(el => el.classList.remove("active"));
  if (btn) btn.classList.add("active");
  renderComponents();
}

function renderAll() {
  const b = BRIDGES_DATA[appState.currentBridgeIdx];
  const rec = ensureBridgeRecord(b);

  // Render Info Card
  document.getElementById("bridgeInfoCard").innerHTML = `
    <div class="info-grid">
      <div class="info-item"><span>橋梁名稱 / ID</span><strong>${b.bridge_name} (${b.bridge_id})</strong></div>
      <div class="info-item"><span>路線 / 里程</span><strong>${b.route_name} ${b.mileage}</strong></div>
      <div class="info-item"><span>結構型式</span><strong>${b.structure_type || '-'}</strong></div>
      <div class="info-item"><span>起訖構件</span><strong>${b.start_comp} ~ ${b.end_comp}</strong></div>
      <div class="info-item"><span>前次檢測日期</span><strong>${b.prev_date || '-'}</strong></div>
    </div>
    ${b.prev_notes ? `<div class="prev-note"><strong> 前次檢測員意見：</strong>${b.prev_notes}</div>` : ''}
    <div class="meta-inputs">
      <label>本次檢測日期<input type="date" value="${rec.inspectDate}" onchange="updateMeta('inspectDate', this.value)"></label>
      <label>檢測人員<input type="text" placeholder="例：陳冠維、張育誠" value="${rec.inspectors}" onchange="updateMeta('inspectors', this.value)"></label>
      <label>相機前綴(選填)<input type="text" placeholder="例：DSC_ 或 IMG_" value="${rec.cameraPrefix}" onchange="updateMeta('cameraPrefix', this.value)"></label>
    </div>
  `;

  updateProgress();
  renderComponents();
}

function updateMeta(field, val) {
  const b = BRIDGES_DATA[appState.currentBridgeIdx];
  const rec = ensureBridgeRecord(b);
  rec[field] = val;
  saveState();
}

function updateProgress() {
  const b = BRIDGES_DATA[appState.currentBridgeIdx];
  const rec = ensureBridgeRecord(b);
  const validItems = rec.items.filter(i => i.status !== "NA");
  const doneItems = validItems.filter(i => i.status === "NORMAL" || i.status === "DEFECT");
  const pct = validItems.length ? Math.round((doneItems.length / validItems.length) * 100) : 100;
  document.getElementById("progressFill").style.width = pct + "%";
  document.getElementById("progressText").innerText = `${doneItems.length} / ${validItems.length} 已檢 (${pct}%)`;
}

function renderComponents() {
  const b = BRIDGES_DATA[appState.currentBridgeIdx];
  const rec = ensureBridgeRecord(b);
  const listEl = document.getElementById("componentList");
  listEl.innerHTML = "";

  rec.items.forEach((item, idx) => {
    // Filter logic
    if (appState.filter === "UNINSPECTED" && item.status !== "UNINSPECTED") return;
    if (appState.filter === "ALERT" && !item.is_alert) return;
    if (appState.filter === "DEFECT" && item.status !== "DEFECT") return;
    if (["全橋", "橋台(橋頭/橋尾)", "橋墩", "橋孔(跨)"].includes(appState.filter) && item.category !== appState.filter) return;

    const statusClass =
      item.status === "NORMAL" ? "status-normal" :
      item.status === "DEFECT" ? "status-defect" :

        <span style="font-size:13px; font-weight:bold; color:#1e40af;">照片編號:</span>
        <input type="text" placeholder="輸入相機編號 (如 0142 或 142-145)" value="${item.photoNo || ''}" onchange="updateItemPhoto(${idx}, this.value)">
      </div>
    ` : "";

    let defectsHtml = "";
    if (item.status === "DEFECT") {
      if (item.defects.length === 0) {
        item.defects.push({
          defectLoc: "", defectType: "", D: "2", E: "1", R: "1", U: "1", qty: "", unit: "處", photoNo: "", note: ""
        });
      }
      defectsHtml = item.defects.map((d, dIdx) => `
        <div style="background:#fff; border:1px solid #fecaca; border-radius:8px; padding:10px; margin-top:8px;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
            <strong style="font-size:13px; color:#b91c1c;">劣化紀錄 #${dIdx + 1}</strong>
            ${item.defects.length > 1 ? `<button class="btn btn-danger" style="padding:2px 8px; font-size:12px;" onclick="removeDefect(${idx}, ${dIdx})">刪除</button>` : ''}
          </div>
          <div class="form-grid">

            <input type="text" list="defectTypes" placeholder="劣化樣態 (點擊選擇或輸入)" value="${d.defectType}" onchange="updateDefect(${idx}, ${dIdx}, 'defectType', this.value)">
          </div>
          <div class="deru-grid">
            <div class="deru-box"><label>D (劣化)</label>
              <select onchange="updateDefect(${idx}, ${dIdx}, 'D', this.value)">
                ${["1","2","3","4"].map(v => `<option value="${v}" ${d.D===v?'selected':''}>${v}</option>`).join('')}
              </select>
            </div>
            <div class="deru-box"><label>E (範圍)</label>
              <select onchange="updateDefect(${idx}, ${dIdx}, 'E', this.value)">
                ${["1","2","3","4"].map(v => `<option value="${v}" ${d.E===v?'selected':''}>${v}</option>`).join('')}
              </select>
            </div>
            <div class="deru-box"><label>R (關聯)</label>
              <select onchange="updateDefect(${idx}, ${dIdx}, 'R', this.value)">
                ${["1","2","3","4"].map(v => `<option value="${v}" ${d.R===v?'selected':''}>${v}</option>`).join('')}
              </select>
            </div>
            <div class="deru-box"><label>U (急迫)</label>
              <select onchange="updateDefect(${idx}, ${dIdx}, 'U', this.value)">
                ${["1","2","3","4"].map(v => `<option value="${v}" ${d.U===v?'selected':''}>${v}</option>`).join('')}
              </select>
            </div>
          </div>
          <div class="form-grid">
            <input type="number" step="any" placeholder="數量" value="${d.qty}" onchange="updateDefect(${idx}, ${dIdx}, 'qty', this.value)">
            <select onchange="updateDefect(${idx}, ${dIdx}, 'unit', this.value)">
              ${d.unit && !UNIT_TYPES.includes(d.unit) ? `<option value="${d.unit}" selected>${d.unit}</option>` : ''}
              ${UNIT_TYPES.map(unit => `<option value="${unit}" ${d.unit===unit?'selected':''}>${unit}</option>`).join('')}
            </select>
          </div>
          <div class="photo-row">
            <span style="font-size:13px; font-weight:bold; color:#1e40af;"> 照片編號:</span>
            <input type="text" placeholder="輸入相機編號 (如 0142 或 142-145)" value="${d.photoNo}" onchange="updateDefect(${idx}, ${dIdx}, 'photoNo', this.value)">
            <button class="q-btn" style="padding:4px 8px; font-size:12px;" onclick="autoIncrementPhoto(${idx}, ${dIdx})">+1連號</button>
          </div>
          <div style="margin-top:6px;">
            <input type="text" style="width:100%;" placeholder="備註說明..." value="${d.note}" onchange="updateDefect(${idx}, ${dIdx}, 'note', this.value)">
          </div>
        </div>
      `).join("") + `
        <button class="q-btn" style="margin-top:8px; width:100%; border-style:dashed;" onclick="addDefect(${idx})">➕ 此構件新增另一筆劣化</button>
      `;
    }

    card.innerHTML = `
      <div class="comp-header">
        <div class="comp-title">
          <span class="loc-tag">${item.location}</span>${item.component}
        </div>
        <span class="prev-tag ${item.is_alert ? 'alert' : ''}">前次: ${item.prev_str}</span>
      </div>
      <div class="quick-btns">
        <button class="q-btn ${item.status==='NORMAL' ? 'active-ok' : ''}" onclick="setItemStatus(${idx}, 'NORMAL')">✅ 正常 (D=1)</button>
        <button class="q-btn ${item.status==='DEFECT' ? 'active-defect' : ''}" onclick="setItemStatus(${idx}, 'DEFECT')">⚠️ 有劣化 / 拍照</button>
        <button class="q-btn ${item.status==='NA' ? 'active-na' : ''}" onclick="setItemStatus(${idx}, 'NA')">➖ 無此構件</button>
      </div>
      <div class="defect-panel ${item.status==='DEFECT' ? 'show' : ''}">
        ${defectsHtml}
      </div>
      ${itemPhotoHtml}
    `;
    listEl.appendChild(card);
  });
}

function setItemStatus(idx, status) {
  const b = BRIDGES_DATA[appState.currentBridgeIdx];
  const rec = ensureBridgeRecord(b);
  rec.items[idx].status = status;
  if (status === "DEFECT" && rec.items[idx].defects.length === 0) {
    rec.items[idx].defects.push({
      defectLoc: "", defectType: "", D: "2", E: "1", R: "1", U: "1", qty: "", unit: "處", photoNo: "", note: ""
    });
  }
  saveState();
  updateProgress();
  renderComponents();
}

function updateDefect(itemIdx, dIdx, field, val) {
  const b = BRIDGES_DATA[appState.currentBridgeIdx];
  const rec = ensureBridgeRecord(b);
  rec.items[itemIdx].defects[dIdx][field] = val;
  if (field === "photoNo" && val.trim() !== "") {
    rec.lastPhotoNo = val.trim();
  }
  saveState();
}

function updateItemPhoto(itemIdx, val) {
  const b = BRIDGES_DATA[appState.currentBridgeIdx];
  const rec = ensureBridgeRecord(b);
  rec.items[itemIdx].photoNo = val;
  if (val.trim() !== "") rec.lastPhotoNo = val.trim();
  saveState();
}

function autoIncrementPhoto(itemIdx, dIdx) {
  const b = BRIDGES_DATA[appState.currentBridgeIdx];
  const rec = ensureBridgeRecord(b);
  const last = rec.lastPhotoNo || "";
  const match = last.match(/(\d+)(?!.*\d)/);
  let nextPhoto = "";
  if (match) {
    const numStr = match[1];
    const nextNum = (parseInt(numStr, 10) + 1).toString().padStart(numStr.length, '0');
    nextPhoto = last.slice(0, match.index) + nextNum + last.slice(match.index + numStr.length);
  } else {
    nextPhoto = (rec.cameraPrefix || "") + "0001";
  }
  rec.items[itemIdx].defects[dIdx].photoNo = nextPhoto;
  rec.lastPhotoNo = nextPhoto;
  saveState();
  renderComponents();
}

function addDefect(itemIdx) {
  const b = BRIDGES_DATA[appState.currentBridgeIdx];
  const rec = ensureBridgeRecord(b);
  rec.items[itemIdx].defects.push({
    defectLoc: "", defectType: "", D: "2", E: "1", R: "1", U: "1", qty: "", unit: "處", photoNo: "", note: ""
  });
  saveState();
  renderComponents();
}

function removeDefect(itemIdx, dIdx) {
  const b = BRIDGES_DATA[appState.currentBridgeIdx];
  const rec = ensureBridgeRecord(b);
  rec.items[itemIdx].defects.splice(dIdx, 1);
  saveState();
  renderComponents();
}

async function markRemainingNormal() {
  const ans = await uiDialog("確定要將所有「未檢」構件設為「正常 (D=1)」?", [], "確定");
  if (ans === null) return;
  const b = BRIDGES_DATA[appState.currentBridgeIdx];
  const rec = ensureBridgeRecord(b);
  rec.items.forEach(item => {
    if (item.status === "UNINSPECTED") {
      item.status = "NORMAL";
    }
  });
  saveState();
  updateProgress();
  renderComponents();
}

async function addExtraDefectModal() {
  const ans = await uiDialog("新增額外劣化列", [
    { label: "構件位置", placeholder: "例如 P02 或 S03" },
    { label: "構件名稱", placeholder: "例如 橋墩/帽梁" }
  ], "新增");
  if (ans === null) return;
  const loc = ans[0], comp = ans[1];
  if (!comp.trim()) return;
  const b = BRIDGES_DATA[appState.currentBridgeIdx];
  const rec = ensureBridgeRecord(b);
  rec.items.push({
    id: rec.items.length,
    category: "手動新增",
    location: loc.trim() || "全橋",
    component: comp.trim().replace(/^[0-9０-９]+[.．、] */, ""),
    prev_str: "手動新增",
    is_alert: false,
    status: "DEFECT",
    photoNo: "",
    defects: [{ defectLoc: "", defectType: "", D: "2", E: "1", R: "1", U: "1", qty: "", unit: "處", photoNo: "", note: "" }]
  });
  saveState();
  updateProgress();
  renderComponents();
}

function exportCSV() {
  const b = BRIDGES_DATA[appState.currentBridgeIdx];
  const rec = ensureBridgeRecord(b);

  // Headers matching user's Excel format + bridge metadata & photo number
  const headers = [
    "橋梁ID", "橋梁名稱", "檢測日期", "檢測人員",
    "編號", "構件", "構件位置", "劣化位置", "劣化樣態",
    "D", "E", "R", "U", "數量", "單位", "照片編號", "備註", "前次DERU"
  ];

  const rows = [headers];
  let seq = 1;

  rec.items.forEach(item => {
    if (item.status === "NA") {
      if (!item.photoNo) return;
      const photoFull = rec.cameraPrefix && !item.photoNo.startsWith(rec.cameraPrefix) ? rec.cameraPrefix + item.photoNo : item.photoNo;
      rows.push([
        b.bridge_id, b.bridge_name, rec.inspectDate, rec.inspectors,
        seq++, item.component, item.location, "-", "無此構件",
        "", "", "", "", "", "", photoFull, "", item.prev_str
      ]);
      return;
    }
    if (item.status === "NORMAL") {
      const photoFull = item.photoNo ? (rec.cameraPrefix && !item.photoNo.startsWith(rec.cameraPrefix) ? rec.cameraPrefix + item.photoNo : item.photoNo) : "";
      rows.push([
        b.bridge_id, b.bridge_name, rec.inspectDate, rec.inspectors,
        seq++, item.component, item.location, "-", "無異常",
        "1", "", "", "", "", "", photoFull, "", item.prev_str
      ]);
    } else if (item.status === "DEFECT") {
      item.defects.forEach(d => {
        const photoFull = d.photoNo ? (rec.cameraPrefix && !d.photoNo.startsWith(rec.cameraPrefix) ? rec.cameraPrefix + d.photoNo : d.photoNo) : "";
        rows.push([
          b.bridge_id, b.bridge_name, rec.inspectDate, rec.inspectors,
          seq++, item.component, item.location, d.defectLoc, d.defectType,
          d.D, d.E, d.R, d.U, d.qty, d.unit, photoFull, d.note, item.prev_str
        ]);
      });
    } else {
      rows.push([
        b.bridge_id, b.bridge_name, rec.inspectDate, rec.inspectors,
        seq++, item.component, item.location, "", "未檢測",
        "", "", "", "", "", "", "", "", item.prev_str
      ]);
    }
  });

  const csvContent = "﻿" + rows.map(r =>
    r.map(cell => `"${(cell ?? "").toString().replace(/"/g, '""')}"`).join(",")
  ).join("\n");

  saveTextFile(`${b.bridge_id}_${b.bridge_name}_現場檢測紀錄_${rec.inspectDate}.csv`, csvContent, "text/csv;charset=utf-8");
}

function exportBackupJSON() {
  saveTextFile(`全部橋梁現場紀錄備份_${localDateStr()}.json`, JSON.stringify(appState.records, null, 2), "application/json");
}
